name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify

  package-check:
    name: Package + self-test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Cache bundled assets
        uses: actions/cache@v6
        with:
          path: |
            target/app/voices
            target/app/engines
          key: bundled-assets-${{ runner.os }}-${{ hashFiles('src/main/resources/tts/voices-catalog.json', 'src/main/java/souris/botdealer/service/music/engine/EngineAssets.java') }}

      - name: Build application image
        run: mvn -B -ntp -Ppackage -Djpackage.type=app-image -Djpackage.dest=target/dist/app-image package -DskipTests
      - name: Self-test the packaged image
        run: ./target/dist/app-image/BotDealer/bin/BotDealer --self-test
