# Test-only Spring configuration: isolated H2 file under target/, schema recreated per run.
# botdealer.log.dir keeps test logs inside target/ even if the main logback-spring.xml is used.
spring.application.name=botdealer-test
spring.main.web-application-type=none
botdealer.log.dir=target/test-logs
spring.datasource.url=jdbc:h2:file:./target/test-db/botdealer-test;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=WARN
