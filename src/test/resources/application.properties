# Test-only Spring configuration: isolated H2 + secrets under target/, schema recreated per run.
# botdealer.security.store=file keeps tests away from the developer's real OS keychain.
spring.application.name=botdealer-test
spring.main.web-application-type=none
botdealer.data.dir=target/test-data
botdealer.security.store=file
botdealer.log.dir=target/test-logs
spring.datasource.url=jdbc:h2:file:./target/test-db/botdealer-test;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=WARN
