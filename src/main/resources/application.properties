# ---------------------------------------------------------------------------
# BotDealer configuration (committed on purpose: it contains NO secrets).
# The Discord token and the YouTube OAuth refresh token live in the OS keychain
# (Windows Credential Manager / macOS Keychain / Linux Secret Service), never here.
# They are also never written to the database and never logged.
#
# Local overrides: create a file at <dataDir>/config/application.properties
# (Phase 1 wires that location in) - do not edit this file for personal settings.
# ---------------------------------------------------------------------------
spring.application.name=botdealer

# Desktop app: no web server, no actuator endpoints, no H2 console.
spring.main.web-application-type=none

# H2 file database inside the per-user data folder.
# AppPaths publishes "botdealer.data.dir" before Spring boots
# (%APPDATA%\BotDealer on Windows, ~/.local/share/BotDealer on Linux).
# The ${...:-...} fallback keeps unit tests working without launching main().
spring.datasource.url=jdbc:h2:file:${botdealer.data.dir:${user.home}/.local/share/BotDealer}/db/botdealer;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" creates the tables automatically. The real schema lands in Phase 3.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Rotating log file inside the data folder. The %mask pattern (logback-spring.xml)
# redacts anything that looks like a Discord token, as defense in depth.
botdealer.log.dir=${botdealer.data.dir:${user.home}/.local/share/BotDealer}/logs
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
