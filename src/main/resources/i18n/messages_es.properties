wizard.token.skipped=No pasa nada: podés agregar el token más tarde en Ajustes.
wizard.token.skipHint=Todavía no tengo un token
wizard.token.help=¿Cómo obtengo un token?
wizard.token.help.body=1. Abrí https://discord.com/developers/applications\n2. Hacé clic en "New Application" y ponele un nombre.\n3. Abrí la sección "Bot" en el menú de la izquierda.\n4. Presioná "Reset Token" (o "Copy" si acabás de crear el bot).\n5. Pegá el token en BotDealer.\n\nMantené el token en secreto. Quien lo tenga controla tu bot. BotDealer lo guarda en el llavero de tu sistema operativo, nunca en un archivo del proyecto.
wizard.token.storeNote=Por tu seguridad el token no se vuelve a mostrar nunca y no se escribe en los registros. Va al llavero de tu sistema (o a un archivo cifrado si tu sistema no tiene llavero).
wizard.token.result.empty=Pegá un token primero.
wizard.token.result.valid=El token funciona.
wizard.token.result.invalid=Discord rechazó este token. Fijate que hayas copiado el valor completo y que no lo hayas regenerado.
wizard.token.result.malformed=Eso no parece un token de bot de Discord. Los tokens tienen tres partes separadas por puntos.
wizard.token.result.rateLimited=Discord nos está limitando. Esperá un minuto y probá de nuevo.
wizard.token.result.network=No se pudo contactar a Discord. Revisá tu conexión a internet e intentá otra vez.
wizard.token.result.http=Discord respondió con un estado inesperado ({0}).

