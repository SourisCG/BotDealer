# ---------------------------------------------------------------- asistente: idioma
wizard.language.title=Te damos la bienvenida a BotDealer
wizard.language.subtitle=Vamos a configurar todo. Toma unos dos minutos.
wizard.language.body=Elegí el idioma de la aplicación. BotDealer lo detectó de tu sistema y podés cambiarlo cuando quieras desde la barra lateral.
