wizard.music.engine.ytdlp.body=El mismo audio, con un respaldo que se actualiza solo cuando YouTube cambia. Ya viene incluido en el instalador.
wizard.music.adsNote=En los tres casos: sin anuncios del reproductor, no se descarga nada salvo que actives la caché, y los creadores tampoco ganan con esta reproducción. Si te gusta un tema, dale también una reproducción real.
wizard.music.oauthNote=Si YouTube alguna vez pregunta "¿sos humano?", podés vincular una cuenta de Google descartable desde Ajustes. Es opcional, usa el flujo oficial de Google y la clave queda en el llavero de tu sistema.

