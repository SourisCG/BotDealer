# ---------------------------------------------------------------- asistente: token
wizard.token.title=Conectá tu bot de Discord
wizard.token.subtitle=BotDealer necesita un token de bot para hablar con Discord.
wizard.token.body=Creá una aplicación en el Portal de Desarrolladores de Discord, abrí la sección Bot y copiá su token. Pegalo abajo: lo probamos contra Discord antes de guardar nada.
wizard.token.label=Token del bot
wizard.token.prompt=Pegá acá el token de tu bot
wizard.token.test=Probar conexión
wizard.token.testing=Probando el token con Discord...
wizard.token.identity=Conectado como {0} (@{1})
wizard.token.saved=Token verificado y listo para guardarse cuando termines.
wizard.token.skipped=No pasa nada: podés agregar el token más tarde en Ajustes.
wizard.token.skipHint=Todavía no tengo un token
wizard.token.help=¿Cómo obtengo un token?
wizard.token.help.body=1. Abrí https://discord.com/developers/applications\n2. Hacé clic en "New Application" y ponele un nombre.\n3. Abrí la sección "Bot" en el menú de la izquierda.\n4. Presioná "Reset Token" (o "Copy" si acabás de crear el bot).\n5. Pegá el token en BotDealer.\n\nMantené el token en secreto. Quien lo tenga controla tu bot. BotDealer lo guarda en el llavero de tu sistema operativo, nunca en un archivo del proyecto.
wizard.token.storeNote=Por tu seguridad el token no se vuelve a mostrar nunca y no se escribe en los registros. Va al llavero de tu sistema (o a un archivo cifrado si tu sistema no tiene llavero).
wizard.token.result.empty=Pegá un token primero.
wizard.token.result.valid=El token funciona.
wizard.token.result.invalid=Discord rechazó este token. Fijate que hayas copiado el valor completo y que no lo hayas regenerado.
wizard.token.result.malformed=Eso no parece un token de bot de Discord. Los tokens tienen tres partes separadas por puntos.
wizard.token.result.rateLimited=Discord nos está limitando. Esperá un minuto y probá de nuevo.
wizard.token.result.network=No se pudo contactar a Discord. Revisá tu conexión a internet e intentá otra vez.
wizard.token.result.http=Discord respondió con un estado inesperado ({0}).

# ---------------------------------------------------------------- asistente: economía
wizard.economy.title=Ponele nombre a tu moneda
wizard.economy.subtitle=Dinero ficticio para apostar. Sin valor real, nunca.
wizard.economy.body=BotDealer usa una moneda ficticia para las apuestas. Por defecto es el chorizo, pero podés llamarla como quieras.
wizard.economy.singular=Singular
wizard.economy.plural=Plural
wizard.economy.symbol=Símbolo
wizard.economy.startingBalance=Saldo inicial
wizard.economy.dailyAmount=Recompensa diaria
wizard.economy.dailyCooldown=Espera diaria (horas)
wizard.economy.hint=Los miembros nuevos reciben el saldo inicial la primera vez que usan el bot. La recompensa diaria es una recarga periódica que reclaman con un comando.
wizard.economy.error.names=La moneda necesita un nombre en singular y otro en plural.

# ---------------------------------------------------------------- asistente: música
wizard.music.title=¿Cómo querés que suene la música?
wizard.music.subtitle=Dos motores, el mismo audio. Vos elegís.
wizard.music.body=BotDealer puede obtener el audio de YouTube de dos formas. Elegí la que prefieras; podés cambiarla después en Ajustes.
wizard.music.engine.auto.title=Automático (recomendado)
wizard.music.engine.auto.body=Intenta primero el motor directo y cambia al reforzado si YouTube se pone difícil. Lo mejor de los dos.
wizard.music.engine.direct.title=Directo
wizard.music.engine.direct.body=Reproduce al instante y sin componentes extra. Si YouTube cambia algo, esperás una actualización de BotDealer.
wizard.music.engine.ytdlp.title=Reforzado (yt-dlp)
wizard.music.engine.ytdlp.body=El mismo audio, con un respaldo que se actualiza solo cuando YouTube cambia. Ya viene incluido en el instalador.
wizard.music.adsNote=En los tres casos: sin anuncios del reproductor, no se descarga nada salvo que actives la caché, y los creadores tampoco ganan con esta reproducción. Si te gusta un tema, dale también una reproducción real.
wizard.music.oauthNote=Si YouTube alguna vez pregunta "¿sos humano?", podés vincular una cuenta de Google descartable desde Ajustes. Es opcional, usa el flujo oficial de Google y la clave queda en el llavero de tu sistema.

