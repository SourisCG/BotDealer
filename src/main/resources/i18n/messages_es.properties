# ---------------------------------------------------------------- acerca de
about.title=Acerca de BotDealer
about.version=Versión {0}
about.license=Licencia
about.license.body=BotDealer es software libre publicado bajo la Licencia Pública General de GNU v3. Podés usarlo, estudiarlo, compartirlo y modificarlo. El motor de voz Piper y su fonemizador espeak-ng incluidos son GPL-3.0, y por eso toda la distribución es GPL-3.0.
about.credits=Créditos
about.credits.body=BotDealer se apoya en el trabajo de otros: JDA y JDAVE para Discord, LavaPlayer y youtube-source para la música, Piper para las voces sin conexión, Spring Boot y OpenJFX para la aplicación. La lista completa está en THIRD_PARTY_LICENSES.md del proyecto.
