# ---------------------------------------------------------------- asistente: token
wizard.token.title=Conectá tu bot de Discord
wizard.token.subtitle=BotDealer necesita un token de bot para hablar con Discord.
wizard.token.body=Creá una aplicación en el Portal de Desarrolladores de Discord, abrí la sección Bot y copiá su token. Pegalo abajo: lo probamos contra Discord antes de guardar nada.
wizard.token.label=Token del bot
wizard.token.prompt=Pegá acá el token de tu bot
wizard.token.test=Probar conexión
