# ---------------------------------------------------------------- asistente: música
wizard.music.title=¿Cómo querés que suene la música?
wizard.music.subtitle=Dos motores, el mismo audio. Vos elegís.
wizard.music.body=BotDealer puede obtener el audio de YouTube de dos formas. Elegí la que prefieras; podés cambiarla después en Ajustes.
wizard.music.engine.auto.title=Automático (recomendado)
wizard.music.engine.auto.body=Intenta primero el motor directo y cambia al reforzado si YouTube se pone difícil. Lo mejor de los dos.
wizard.music.engine.direct.title=Directo
wizard.music.engine.direct.body=Reproduce al instante y sin componentes extra. Si YouTube cambia algo, esperás una actualización de BotDealer.
