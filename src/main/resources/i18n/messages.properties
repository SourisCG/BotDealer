about.license=License
about.license.body=BotDealer is free software released under the GNU General Public License v3. You can use, study, share and modify it. The bundled Piper speech engine and its espeak-ng phonemizer are GPL-3.0, which is why the whole distribution is GPL-3.0.
about.credits=Credits
about.credits.body=BotDealer stands on the work of others: JDA and JDAVE for Discord, LavaPlayer and youtube-source for music, Piper for offline voices, Spring Boot and OpenJFX for the app itself. See THIRD_PARTY_LICENSES.md in the project for the full list.

