# ---------------------------------------------------------------- wizard: language
wizard.language.title=Welcome to BotDealer
wizard.language.subtitle=Let us set everything up. It takes about two minutes.
wizard.language.body=Pick the language for the app. BotDealer detected it from your system, and you can change it any time from the sidebar.
wizard.language.en=English
wizard.language.es=Español
wizard.language.hint=This also sets the default language the bot uses in Discord.

# ---------------------------------------------------------------- wizard: token
wizard.token.title=Connect your Discord bot
wizard.token.subtitle=BotDealer needs a bot token to talk to Discord.
wizard.token.body=Create an application in the Discord Developer Portal, open the Bot section, and copy its token. Paste it below: we test it against Discord before saving anything.
wizard.token.label=Bot token
wizard.token.prompt=Paste your bot token here
wizard.token.test=Test connection
wizard.token.testing=Testing the token with Discord...
wizard.token.identity=Connected as {0} (@{1})
wizard.token.saved=Token verified and ready to be saved when you finish.
wizard.token.skipped=No problem: you can add the token later in Settings.
wizard.token.skipHint=I do not have a token yet
wizard.token.help=How do I get a token?
wizard.token.help.body=1. Open https://discord.com/developers/applications\n2. Click "New Application" and give it a name.\n3. Open the "Bot" section in the left menu.\n4. Press "Reset Token" (or "Copy" if you just created the bot).\n5. Paste the token in BotDealer.\n\nKeep the token secret. Anyone who has it controls your bot. BotDealer stores it in your operating system keychain, never in a file inside the project.
wizard.token.storeNote=For your safety the token is never shown again and never written to logs. It goes to your OS keychain (or an encrypted file if your system has no keychain).
wizard.token.result.empty=Paste a token first.
wizard.token.result.valid=The token works.
wizard.token.result.invalid=Discord rejected this token. Check that you copied the whole value and that it was not regenerated.
wizard.token.result.malformed=That does not look like a Discord bot token. Tokens have three parts separated by dots.
wizard.token.result.rateLimited=Discord is rate limiting us. Wait a minute and try again.
wizard.token.result.network=Could not reach Discord. Check your internet connection and try again.
wizard.token.result.http=Discord answered with an unexpected status ({0}).

# ---------------------------------------------------------------- wizard: economy
wizard.economy.title=Name your currency
wizard.economy.subtitle=Play money for bets. No real value, ever.
wizard.economy.body=BotDealer uses a fake currency for betting. The default is the chorizo, but you can call it whatever your community likes.
wizard.economy.singular=Singular
wizard.economy.plural=Plural
wizard.economy.symbol=Symbol
wizard.economy.startingBalance=Starting balance
wizard.economy.dailyAmount=Daily reward
wizard.economy.dailyCooldown=Daily cooldown (hours)
wizard.economy.hint=New members receive the starting balance the first time they use the bot. The daily reward is a periodic top-up they can claim with a command.
wizard.economy.error.names=The currency needs a singular and a plural name.

# ---------------------------------------------------------------- wizard: music
wizard.music.title=How should the music play?
wizard.music.subtitle=Two engines, same audio. You choose.
wizard.music.body=BotDealer can get YouTube audio in two ways. Pick whichever you prefer; you can switch later in Settings.
wizard.music.engine.auto.title=Automatic (recommended)
wizard.music.engine.auto.body=Tries the direct engine first and switches to the reinforced one if YouTube makes trouble. Best of both.
wizard.music.engine.direct.title=Direct
wizard.music.engine.direct.body=Plays instantly with no extra components. If YouTube changes something, you wait for a BotDealer update.
wizard.music.engine.ytdlp.title=Reinforced (yt-dlp)
wizard.music.engine.ytdlp.body=Same audio, with a backup that updates itself when YouTube changes. Already included in the installer.
wizard.music.adsNote=In all three cases: no player ads, nothing is downloaded unless you enable the cache, and creators do not earn from this playback either. If you love a song, give it a real play too.
wizard.music.oauthNote=If YouTube ever asks "are you human?", you can link a throwaway Google account later in Settings. It is optional, uses Google official flow, and the key stays in your system keychain.

# ---------------------------------------------------------------- wizard: tts
wizard.tts.title=Give the bot a voice
wizard.tts.subtitle=Offline neural voices, no internet required.
wizard.tts.body=BotDealer can read messages out loud in your voice channel using neural voices that run on your own computer. Nothing is sent to a third party.
wizard.tts.enabled=Enable text to speech
wizard.tts.voice=Voice
wizard.tts.speed=Speed: {0}x
wizard.tts.note=The three voices below are included in the installer. More voices can be downloaded later from Settings.
wizard.tts.voice.default=Engine default voice
wizard.tts.voice.esSharvard=Spanish (Sharvard, two voices)
wizard.tts.voice.enLessac=English (Lessac)
wizard.tts.voice.enLibritts=English (LibriTTS, many voices)

