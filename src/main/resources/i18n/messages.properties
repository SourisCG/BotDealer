wizard.language.hint=This also sets the default language the bot uses in Discord.

# ---------------------------------------------------------------- wizard: token
wizard.token.title=Connect your Discord bot
wizard.token.subtitle=BotDealer needs a bot token to talk to Discord.
wizard.token.body=Create an application in the Discord Developer Portal, open the Bot section, and copy its token. Paste it below: we test it against Discord before saving anything.
wizard.token.label=Bot token
wizard.token.prompt=Paste your bot token here
wizard.token.test=Test connection
wizard.token.testing=Testing the token with Discord...
wizard.token.identity=Connected as {0} (@{1})
wizard.token.saved=Token verified and ready to be saved when you finish.
wizard.token.skipped=No problem: you can add the token later in Settings.
wizard.token.skipHint=I do not have a token yet
wizard.token.help=How do I get a token?
wizard.token.help.body=1. Open https://discord.com/developers/applications\n2. Click "New Application" and give it a name.\n3. Open the "Bot" section in the left menu.\n4. Press "Reset Token" (or "Copy" if you just created the bot).\n5. Paste the token in BotDealer.\n\nKeep the token secret. Anyone who has it controls your bot. BotDealer stores it in your operating system keychain, never in a file inside the project.
wizard.token.storeNote=For your safety the token is never shown again and never written to logs. It goes to your OS keychain (or an encrypted file if your system has no keychain).
wizard.token.result.empty=Paste a token first.
wizard.token.result.valid=The token works.
wizard.token.result.invalid=Discord rejected this token. Check that you copied the whole value and that it was not regenerated.
wizard.token.result.malformed=That does not look like a Discord bot token. Tokens have three parts separated by dots.
wizard.token.result.rateLimited=Discord is rate limiting us. Wait a minute and try again.
wizard.token.result.network=Could not reach Discord. Check your internet connection and try again.
wizard.token.result.http=Discord answered with an unexpected status ({0}).

# ---------------------------------------------------------------- wizard: economy
wizard.economy.title=Name your currency
wizard.economy.subtitle=Play money for bets. No real value, ever.
wizard.economy.body=BotDealer uses a fake currency for betting. The default is the chorizo, but you can call it whatever your community likes.
